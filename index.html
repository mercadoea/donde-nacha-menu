<!doctype html>
<html lang="es">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="theme-color" content="#ffb718">
  <meta name="description" content="Menú digital de Donde Nacha Fast Food">
  <title>Donde Nacha · Fast Food</title>
  <link rel="icon" href="logo.png">
  <link rel="stylesheet" href="styles.css">
</head>
<body>
  <header class="hero">
    <div class="hero__drip"></div>
    <div class="hero__content">
      <img class="brand-logo" src="logo.png" alt="Donde Nacha Fast Food">
      <div>
        <p class="eyebrow">FAST FOOD</p>
        <h1>Menú</h1>
        <p class="hero__subtitle">Elige tu favorito y arma tu pedido.</p>
      </div>
    </div>
  </header>

  <main class="container">
    <div class="toolbar">
      <label class="search">
        <span>⌕</span>
        <input id="search" type="search" placeholder="Buscar en el menú..." autocomplete="off">
      </label>
      <button id="cartButton" class="cart-button" type="button">
        🛒 <span>Pedido</span> <b id="cartCount">0</b>
      </button>
    </div>

    <nav id="categories" class="categories" aria-label="Categorías"></nav>
    <section id="menu" class="menu-grid" aria-live="polite"></section>
  </main>

  <div id="cartPanel" class="cart-panel" aria-hidden="true">
    <div class="cart-backdrop" id="cartBackdrop"></div>
    <aside class="cart">
      <div class="cart__header">
        <div>
          <p class="eyebrow">TU PEDIDO</p>
          <h2>Resumen</h2>
        </div>
        <button id="closeCart" class="icon-button" type="button" aria-label="Cerrar">×</button>
      </div>
      <div id="cartItems" class="cart__items"></div>
      <div class="cart__footer">
        <div class="total"><span>Total</span><strong id="cartTotal">$0</strong></div>
        <button id="whatsappButton" class="primary-button" type="button">Pedir por WhatsApp</button>
        <p class="tiny">Configura el número de WhatsApp en <code>app.js</code> antes de publicar.</p>
      </div>
    </aside>
  </div>

  <footer>
    <strong>Donde Nacha Fast Food</strong>
    <span>Menú digital · QR</span>
  </footer>

  <script src="app.js"></script>
</body>
</html>
